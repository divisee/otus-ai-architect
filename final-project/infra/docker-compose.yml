# Data Plane стенда. Control Plane запускается на хосте (uvicorn).
# Профиль gpu — целевой контур; на CPU не поднимается.

services:
  neo4j:
    image: neo4j:5.26
    profiles: ["data"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/devpassword
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.2
    profiles: ["data"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    profiles: ["data"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: clinic
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  qdrant_data:
  pg_data:
