apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: app
  labels:
    app: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: llm-gateway-sim:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Крутим "проблемность" сервиса, чтобы демонстрировать алерты.
            - name: ERROR_RATE
              value: "0.08"
            - name: RATE_LIMIT_RATE
              value: "0.05"
            - name: MAX_DELAY
              value: "1.5"
            - name: BASE_LATENCY
              value: "0.05"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 128Mi
